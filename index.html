<!DOCTYPE html>
<html lang="en" ng-app="eventApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presidency University Event Registration</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.2/angular.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="app.js"></script>
  <style>
    body {
      background: url('images/logo.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .container {
      margin-top: 50px;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 10px;
    }
    .event-details {
      margin-top: 15px;
    }
    .poster {
      width: 100%;
      max-width: 400px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container" ng-controller="MainController">
    <div ng-show="!isLoggedIn">
      <h2 class="text-center mb-4">Presidency University - Student Login</h2>
      <form ng-submit="login()">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" class="form-control" id="username" ng-model="loginData.username" required>
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" class="form-control" id="password" ng-model="loginData.password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>

    <div ng-show="isLoggedIn">
      <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#" ng-click="page='home'">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#" ng-click="page='events'">Events List</a></li>
          <li class="nav-item"><a class="nav-link" href="#" ng-click="page='register'">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="#" ng-click="page='feedback'">Feedback</a></li>
        </ul>
      </nav>

      <div ng-show="page==='home'">
        <h3>Welcome to Presidency University Events Portal!</h3>
      </div>

      <div ng-show="page==='events'">
        <h3>Events List</h3>
        <ul class="list-group">
          <li class="list-group-item" ng-repeat="event in events" ng-click="selectEvent(event)">
            {{event.name}}
          </li>
        </ul>

        <div class="event-details" ng-if="selectedEvent">
          <h4>{{selectedEvent.name}}</h4>
          <img ng-src="{{selectedEvent.poster}}" class="poster" alt="Event Poster">
          <p><strong>Date:</strong> {{selectedEvent.date}}</p>
          <p><strong>Guest:</strong> {{selectedEvent.guest}}</p>
        </div>
      </div>

      <div ng-show="page==='register'">
        <h3>Event Registration</h3>
        <form>
          <div class="form-group">
            <label for="eventSelect">Select Event:</label>
            <select id="eventSelect" class="form-control" ng-model="selectedEventForRegistration" ng-options="e.name for e in events"></select>
          </div>
          <div class="form-group">
            <label>Name:</label>
            <input type="text" class="form-control" ng-model="registration.name" required>
          </div>
          <div class="form-group">
            <label>Roll Number:</label>
            <input type="text" class="form-control" ng-model="registration.roll" required>
          </div>
          <div class="form-group">
            <label>Email:</label>
            <input type="email" class="form-control" ng-model="registration.email" required>
          </div>
          <button class="btn btn-success" ng-click="registerEvent()">Register</button>
        </form>
      </div>

      <div ng-show="page==='feedback'">
        <h3>Feedback</h3>
        <form>
          <div class="form-group">
            <label>Name:</label>
            <input type="text" class="form-control" ng-model="feedback.name" required>
          </div>
          <div class="form-group">
            <label>Your Feedback:</label>
            <textarea class="form-control" ng-model="feedback.message" required></textarea>
          </div>
          <button class="btn btn-info" ng-click="submitFeedback()">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    var app = angular.module('eventApp', []);

    app.controller('MainController', function($scope) {
      $scope.isLoggedIn = false;
      $scope.page = 'home';
      $scope.loginData = {};

      $scope.events = [
        {
          name: "Tech Symposium",
          date: "2025-06-10",
          guest: "Dr. A.P. Sharma",
          poster: "images/2.jpg"
        },
        {
          name: "Cultural Fest",
          date: "2025-06-15",
          guest: "Mr. Raj Verma",
          poster: "images/1.jpg"
        },
        {
          name: "Sports Meet",
          date: "2025-06-20",
          guest: "Ms. Neha Singh",
          poster: "images/3.jpg"
        }
      ];

      $scope.login = function() {
        if ($scope.loginData.username && $scope.loginData.password) {
          $scope.isLoggedIn = true;
          $scope.page = 'home';
        } else {
          alert("Please enter username and password.");
        }
      };

      $scope.selectEvent = function(event) {
        $scope.selectedEvent = event;
      };

      $scope.registerEvent = function() {
        if ($scope.registration && $scope.selectedEventForRegistration) {
          alert("Registered for " + $scope.selectedEventForRegistration.name + " as " + $scope.registration.name);
          $scope.registration = {};
          $scope.selectedEventForRegistration = null;
        } else {
          alert("Please fill all registration details.");
        }
      };

      $scope.submitFeedback = function() {
        if ($scope.feedback && $scope.feedback.name && $scope.feedback.message) {
          alert("Thank you for your feedback, " + $scope.feedback.name);
          $scope.feedback = {};
        } else {
          alert("Please enter your name and feedback.");
        }
      };
    });
  </script>
</body>
</html>
